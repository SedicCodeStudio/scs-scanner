name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - os: macos-latest
            python: "3.9"   # the python3 that comes with Apple's command line tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest -q
      - run: python scs.py selftest --no-baseline

  powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Static analysis (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path powershell/scs.ps1 -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: Self-test and quick scan with Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File powershell/scs.ps1 -SelfTest -NoColor
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File powershell/scs.ps1 -NoUpdate -NoColor -Json scan.json
          if ($LASTEXITCODE -gt 1) { exit 1 }
          Get-Content scan.json -Raw | ConvertFrom-Json | Out-Null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.9
      - run: ruff check scs tools tests scs.py
