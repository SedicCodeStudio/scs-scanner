name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # pull requests: a new push replaces the running check; main: every commit gets its own complete run
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - os: macos-latest
            python: "3.9"   # the python3 that comes with Apple's command line tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test suite (pytest 9 needs Python 3.10+)
        if: matrix.python != '3.9'
        run: |
          python -m pip install --require-hashes -r requirements/test.txt
          python -m pytest -q
      - name: Smoke test with Python 3.9 (compile everything, quick scan)
        if: matrix.python == '3.9'
        run: |
          python -m compileall -q scs tools scs.py
          python scs.py version
          python scs.py scan --no-baseline --json smoke.json || [ $? -eq 1 ]   # 1 = detections, still a working scan
          python -c "import json; json.load(open('smoke.json'))"
      - run: python scs.py selftest --no-baseline

  powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Static analysis (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path powershell/scs.ps1 -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: Self-test and quick scan with Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File powershell/scs.ps1 -SelfTest -NoColor
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File powershell/scs.ps1 -NoUpdate -NoColor -Json scan.json
          if ($LASTEXITCODE -gt 1) { exit 1 }
          Get-Content scan.json -Raw | ConvertFrom-Json | Out-Null

  windows-installer:
    name: Windows installer (build, install, test, uninstall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the program and the installer
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Install silently, test the installed program, uninstall
        shell: pwsh
        run: ./packaging/windows/test-installer.ps1

  lint:
    name: Lint (Python code and workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements/lint.txt -r requirements/zizmor.txt
      - run: ruff check scs tools tests scs.py
      - name: Workflow security audit (zizmor, including impostor commits and known-vulnerable actions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format plain .github/workflows

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
