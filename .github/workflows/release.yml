name: Release

# Builds the release as a draft, adds the Windows installer, checks every file of the draft against the source and only
# then publishes it. With immutable releases enabled, the tag and the files of a published release can never change.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # "Run workflow" in the Actions tab: releases the version in scs/core.py and creates its tag

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false   # never stop a release half-way

jobs:
  release:
    name: Build and draft the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: write        # create the draft release
      id-token: write        # sign the build provenance (Sigstore)
      attestations: write    # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Version and tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=$(python -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('scs/core.py').read()).group(1))")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then test "v$v" = "$GITHUB_REF_NAME"; fi
          draft=$(gh release view "v$v" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = "false" ]; then echo "::error::v$v is already released - raise VERSION in scs/core.py"; exit 1; fi
          if [ "$draft" = "true" ]; then gh release delete "v$v" --yes; fi   # leftover draft of an unfinished run
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - run: python -m pip install --require-hashes -r requirements/test.txt && python -m pytest -q
      - name: Build (reproducible)
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python tools/build_release.py --out dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: |
            dist/scs.pyz
            dist/scs.ps1
            dist/SCS-Scanner-*.zip
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # the signed provenance also as a file, for checks without the GitHub API (gh attestation verify --bundle)
          extra=()
          if [ -f "$BUNDLE" ]; then cp "$BUNDLE" "dist/SCS-Scanner-${TAG#v}-provenance.sigstore.json"; extra=(dist/*.sigstore.json); fi
          gh release create "$TAG" dist/scs.pyz dist/scs.ps1 dist/SCS-Scanner-*.zip dist/sbom.cdx.json dist/SHA256SUMS dist/ONE-LINERS.md "${extra[@]}" \
            --draft --title "SCS Scanner ${TAG#v}" --notes-file dist/ONE-LINERS.md --target "$GITHUB_SHA"

  windows-installer:
    name: Windows installer
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write        # add the installer to the draft release
      id-token: write        # sign the build provenance (Sigstore)
      attestations: write    # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Prepare the code signing certificate (only when configured)
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX) {
            $p = Join-Path $env:RUNNER_TEMP 'sign.pfx'
            [IO.File]::WriteAllBytes($p, [Convert]::FromBase64String($env:PFX))
            "SCS_SIGN_PFX=$p" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Build the program and the installer
        shell: pwsh
        env:
          SCS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: ./packaging/windows/build.ps1
      - name: Test the installer (install, self-test, window, uninstall)
        shell: pwsh
        run: ./packaging/windows/test-installer.ps1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/SCS-Scanner-Setup-*.exe
      - name: Add the installer, its provenance and its checksum to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          $setup = Get-ChildItem dist/SCS-Scanner-Setup-*.exe | Select-Object -First 1
          $files = @($setup.FullName)
          if ($env:BUNDLE -and (Test-Path -LiteralPath $env:BUNDLE)) {
            $prov = Join-Path 'dist' ($setup.BaseName + '-provenance.sigstore.json')
            Copy-Item -LiteralPath $env:BUNDLE $prov
            $files += (Resolve-Path $prov).Path
          }
          gh release download $env:TAG --pattern SHA256SUMS --dir dist --clobber
          if ($LASTEXITCODE) { exit 1 }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          [IO.File]::AppendAllText((Resolve-Path dist/SHA256SUMS), "$hash  $($setup.Name)`n")
          gh release upload $env:TAG @files (Resolve-Path dist/SHA256SUMS).Path --clobber
          if ($LASTEXITCODE) { exit 1 }

  publish:
    name: Check the draft and publish it
    needs: [release, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # publish the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check every file of the draft against the source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release download "$TAG" --dir "$RUNNER_TEMP/draft"
          ls -l "$RUNNER_TEMP/draft"
          python tools/verify_release.py "$RUNNER_TEMP/draft" --repo "$GH_REPO"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
