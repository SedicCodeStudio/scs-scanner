name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check that the tag matches the version
        run: |
          v=$(python -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('scs/core.py').read()).group(1))")
          test "v$v" = "$GITHUB_REF_NAME"
      - run: python -m pip install pytest==8.3.5 && python -m pytest -q
      - name: Build (reproducible)
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python tools/build_release.py --out dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/scs.pyz
            dist/scs.ps1
            dist/SCS-Scanner-*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/scs.pyz dist/scs.ps1 dist/SCS-Scanner-*.zip dist/sbom.cdx.json dist/SHA256SUMS dist/ONE-LINERS.md \
            --title "SCS Scanner ${GITHUB_REF_NAME#v}" --notes-file dist/ONE-LINERS.md --verify-tag

  windows-installer:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Prepare the code signing certificate (only when configured)
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX) {
            $p = Join-Path $env:RUNNER_TEMP 'sign.pfx'
            [IO.File]::WriteAllBytes($p, [Convert]::FromBase64String($env:PFX))
            "SCS_SIGN_PFX=$p" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Build the program and the installer
        shell: pwsh
        env:
          SCS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: ./packaging/windows/build.ps1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SCS-Scanner-Setup-*.exe
      - name: Add the installer and its checksum to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist/SCS-Scanner-Setup-*.exe | Select-Object -First 1
          gh release download $env:GITHUB_REF_NAME --pattern SHA256SUMS --dir dist --clobber
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          [IO.File]::AppendAllText((Resolve-Path dist/SHA256SUMS), "$hash  $($setup.Name)`n")
          gh release upload $env:GITHUB_REF_NAME $setup.FullName dist/SHA256SUMS --clobber
