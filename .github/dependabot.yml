version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # hash-pinned tools: requirements/*.txt (tests, lint) and the Windows build (PyInstaller)
  - package-ecosystem: pip
    directories:
      - /
      - /packaging/windows
    schedule:
      interval: monthly
    groups:
      python-tools:
        patterns: ["*"]
